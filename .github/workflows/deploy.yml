# À chaque push sur main : tests → image Docker (GHCR) → déploiement sur le VPS.
# Un push dont les tests échouent n'est jamais déployé.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   VPS_HOST      adresse IP ou nom du VPS
#   VPS_USER      utilisateur SSH (membre du groupe docker)
#   VPS_SSH_KEY   clé privée SSH dédiée au déploiement
#   VPS_PORT      (facultatif) port SSH, 22 par défaut

name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: billetterie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/billetterie_test?schema=public
      DATABASE_URL: postgresql://test:test@localhost:5432/billetterie_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      # Types des routes (PageProps, LayoutProps, RouteContext) générés par Next.js dans .next/.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src scripts test
      - run: npx vitest run

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Fichiers d'exploitation (compose, Caddy, sauvegarde) : toujours la version du commit déployé.
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile,deploy/backup.sh"
          target: /opt/billetterie
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            cd /opt/billetterie
            test -f .env || { echo "Fichier /opt/billetterie/.env manquant (voir deploy/.env.example)"; exit 1; }
            # Version déployée : consignée dans .env pour que les redémarrages manuels gardent la même image.
            sed -i "/^IMAGE=/d;/^IMAGE_TAG=/d" .env
            printf "IMAGE=%s\nIMAGE_TAG=%s\n" "$IMAGE" "$IMAGE_TAG" >> .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            # Vérification : l'application répond.
            for i in $(seq 1 30); do
              if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "Déploiement $IMAGE_TAG opérationnel"; docker image prune -f >/dev/null; exit 0
              fi
              sleep 2
            done
            echo "L'application ne répond pas après le déploiement"; docker compose logs --tail=80 app migrate; exit 1
